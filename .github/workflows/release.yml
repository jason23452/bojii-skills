name: Release CLI and skills pack

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify version and tests
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME"
          npm test

      - name: Build skills pack
        run: |
          mkdir -p dist
          tar -czf dist/bojii-skills-pack.tar.gz AGENTS.md docs .opencode
          cd dist
          sha256sum bojii-skills-pack.tar.gz > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/bojii-skills-pack.tar.gz
            dist/SHA256SUMS.txt
